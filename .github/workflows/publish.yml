name: Publish to PowerShell Gallery

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to PowerShell Gallery'
        required: true
        default: false
        type: boolean

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Dependencies
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module -Name ModuleTools -RequiredVersion 1.3.0 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Build Module
        shell: pwsh
        run: Invoke-MTBuild

      - name: Run Pester Tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = "tests"
          $config.Run.Exit = $true
          $config.CodeCoverage.Enabled = $false
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  publish:
    needs: test
    runs-on: windows-latest
    environment: powershell-gallery
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Dependencies
        shell: pwsh
        run: |
          Install-Module -Name ModuleTools -RequiredVersion 1.3.0 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Build Module
        shell: pwsh
        run: Invoke-MTBuild

      - name: Publish to PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:PSGALLERY_API_KEY)) {
              throw "PSGALLERY_API_KEY secret not configured"
          }
          
          # Find the .psd1 file in dist folder
          $psd1 = Get-ChildItem -Path "dist" -Filter "*.psd1" -Recurse | Select-Object -First 1
          
          if (-not $psd1) {
              throw "No .psd1 module file found in dist folder"
          }
          
          $modulePath = $psd1.Directory.FullName
          $moduleName = $psd1.BaseName
          $moduleVersion = (Import-PowerShellDataFile -Path $psd1.FullName).ModuleVersion.ToString()
          Write-Host "Publishing module from: $modulePath"
          Write-Host "Module: $moduleName Version: $moduleVersion"
          
          $existing = Find-Module -Name $moduleName -Repository PSGallery -ErrorAction SilentlyContinue
          if ($existing -and $existing.Version.ToString() -eq $moduleVersion) {
              Write-Host "Version $moduleVersion already exists on PSGallery. Skipping publish."
              exit 0
          }
          
          $publishParams = @{
              Path       = $modulePath
              Repository = 'PSGallery'
              NuGetApiKey = $env:PSGALLERY_API_KEY
              Force      = $true
          }
          
          Publish-Module @publishParams -Verbose
