# https://www.mkdocs.org/user-guide/configuration/
# https://www.mkdocs.org/user-guide/writing-your-docs/
# https://www.mkdocs.org/user-guide/writing-your-docs/#writing-with-markdown
# mkdocs.yml

site_name: SystemChecks
site_url: https://mattman-ps.github.io/systemchecks/
repo_url: https://github.com/mattman-ps/systemchecks
repo_name: mattman-ps/systemchecks
edit_uri: edit/main/docs/
site_description: A PowerShell module for building comprehensive system checks and health validations
site_author: mattman-ps
copyright: Copyright &copy; 2026 mattman-ps

theme: readthedocs

# Documentation directory
docs_dir: docs
site_dir: site

# Navigation structure
nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Requirements: getting-started/requirements.md
  - Usage:
    - Overview: usage/overview.md
    - Examples: usage/examples.md
  - Development:
    - Contributing: development/contributing.md
    - Project Structure: development/structure.md
    - Testing: development/testing.md
  - Reference:
    - Functions: reference/functions.md
    - Classes: reference/classes.md
  - Changelog: CHANGELOG.md
  - License: LICENSE.md

# Markdown extensions
markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed
  - pymdownx.details

